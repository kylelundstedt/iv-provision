name: CI

# `push:` + `pull_request:` ran the SAME commit twice on every PR branch. That is
# not just waste: on 2026-08-19 the duplicate push run for 969c66a hung six hours
# in the Shellcheck step and was killed at the job limit, while the pull_request
# run for the identical tree passed in sixteen seconds -- so the PR showed a red
# X caused entirely by a redundant run of code that was fine.
#
# Build branches on push only when they are `main`; PR branches are covered by
# the pull_request event, which is also what matches on the merge result rather
# than the branch tip.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

# A newer push supersedes an in-flight run of the same ref. Without this, a
# wedged job keeps a stale red X on the PR even after the fix is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # The default is 360 minutes. Nothing here legitimately takes more than a
    # couple of minutes, so fail fast and loudly instead of burning six hours to
    # reach the same answer.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Apex
        run: |
          version=$(sed -nE 's/^APEX_VERSION=//p' provision-iv.sh)
          sha=$(sed -nE 's/^APEX_SHA256_AMD64=//p' provision-iv.sh)
          archive="$RUNNER_TEMP/apex.tar.gz"
          curl -fsSL "https://github.com/ApexMarkdown/apex/releases/download/v${version}/apex-${version}-linux-x86_64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/apex-${version}-linux-x86_64/apex" /usr/local/bin/apex
          apex --version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Check shell syntax
        run: |
          while IFS= read -r file; do bash -n "$file"; done < <(
            find . -path ./.git -prune -o -type f -name '*.sh' -print
          )

      # bash -n parses but does not analyse. `local` outside a function is a
      # runtime error it accepts, and one shipped that way.
      #
      # Installed from the upstream release, pinned and checksum-verified, rather
      # than via `apt-get update && apt-get install`. The apt path was the single
      # slowest and least reliable step in this workflow -- it reaches out to
      # every configured archive on a runner whose mirrors we do not control, and
      # it is what hung for six hours on 2026-08-19. It also left the linter
      # version floating, so CI could start rejecting unchanged code because a
      # runner image bumped shellcheck. Pinning matches how provision-iv.sh
      # treats every other binary it installs.
      - name: Shellcheck
        env:
          SHELLCHECK_VERSION: '0.10.0'
          SHELLCHECK_SHA256: '6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87'
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --max-time 120 --retry 3 --retry-all-errors \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          find . -path ./.git -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -S error

      # This repo is public. Fleet runbooks, VM inventory, tailnet policy and
      # client material live in the private iv-infra repo; a new top-level doc
      # or a tailnet address here is the usual way they leak back in.
      - name: Check public-repo boundary
        run: |
          allowed='^(README\.md|LICENSE|bootstrap\.md|building\.md|consuming\.md|design\.md|apple-container-dev-vms\.md|apple-containers-tailscale\.md)$'
          extra=$(git ls-files ':(top,glob)*.md' ':(top,glob)*.qmd' | grep -vE "$allowed" || true)
          if [[ -n "$extra" ]]; then
            printf 'top-level doc not on the public allowlist (move it to iv-infra or extend the list):\n%s\n' "$extra"
            exit 1
          fi
          # Tailscale CGNAT addresses (100.64/10). Vendored skills quote
          # documentation examples, so they are excluded.
          if git grep -nE '(^|[^0-9.])100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}' -- ':!skills/'; then
            echo 'tailnet address found; keep it in iv-infra'
            exit 1
          fi

      - name: Check JSON
        run: |
          jq empty agent/settings.json
          jq empty agent/mcp-servers.json

      - name: Lint Python
        run: uvx --from ruff==0.15.12 ruff check bin/gen-llms-txt bin/render-md-site bin/shot tests/test_gen_llms_txt.py tests/test_render_md_site.py

      - name: Check maintained Python formatting
        run: uvx --from ruff==0.15.12 ruff format --check bin/gen-llms-txt bin/render-md-site tests/test_gen_llms_txt.py tests/test_render_md_site.py

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          tests/test-provision.sh
          tests/test-agentsview-source.sh
          tests/test-ssh-guard.sh

      - name: Render documentation with Apex
        run: |
          bin/render-site .
          test -f _site/llms.txt
          test -f _site/llms-full.txt
          test -f _site/bootstrap.md
          test ! -f _site/TODO.html
